name: Java CI - Test Java

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 26
      uses: actions/setup-java@v4
      with:
        java-version: '26'
        distribution: 'temurin'

    - name: Build with Ant
      run: ant -f build.xml jar

    - name: Run Tests with Ant
      run: ant -f build.xml test
