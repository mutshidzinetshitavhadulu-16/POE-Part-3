name: Java CI - Test Java

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 26
      uses: actions/setup-java@v4
      with:
        java-version: '26'
        distribution: 'temurin'

    - name: Download JUnit
      run: |
        mkdir -p lib
        curl -L -o lib/junit-4.13.2.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
        curl -L -o lib/hamcrest-core-1.3.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

    - name: Build with Ant
      run: ant -f build.xml jar

    - name: Compile Tests Manually
      run: |
        mkdir -p build/test/classes
        find test -name "*.java" > sources.txt
        javac -cp "build/classes:lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar" -d build/test/classes @sources.txt

    - name: Run Tests Manually
      run: |
        TESTS=$(find build/test/classes -name "*Test.class" | sed 's|build/test/classes/||; s|/|.|g; s|\.class$||')
        echo "Running: $TESTS"
        java -cp "build/classes:build/test/classes:lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar" org.junit.runner.JUnitCore $TESTS
