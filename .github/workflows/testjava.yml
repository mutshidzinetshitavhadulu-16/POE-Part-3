name: Java CI - Test Java

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 26
      uses: actions/setup-java@v4
      with:
        java-version: '26'
        distribution: 'temurin'

    - name: Download JUnit
      run: |
        mkdir -p lib
        curl -L -o lib/junit-4.13.2.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
        curl -L -o lib/hamcrest-core-1.3.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

    - name: Build with Ant
      run: ant -f build.xml jar

    - name: Run Tests with Ant
      run: ant -f build.xml test -Dlibs.junit_4.classpath=lib/junit-4.13.2.jar -Dlibs.hamcrest.classpath=lib/hamcrest-core-1.3.jar -Djavac.test.classpath=lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar
